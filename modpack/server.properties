# Conservative defaults for a private Emberbound server.
# Match server.jar and all server-side mod versions to Minecraft 1.20.1 Forge.
# Do not expose an unauthenticated server directly to the public internet.

motd=Emberbound RPG Adventure
max-players=4
view-distance=7
simulation-distance=4
max-tick-time=60000
difficulty=normal
hardcore=false
spawn-protection=0
allow-flight=false
enable-command-block=false
sync-chunk-writes=true
